name: check-base-url

# One-off: reads the ALB base URL and prints it only as ciphertext, encrypted to an RSA public key
# made on the requester's machine, so the public log never holds the address. Delete once used.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Base64 of an RSA public key in PEM form"
        required: true
        type: string

permissions:
  contents: read

jobs:
  read:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Encrypt the base URL
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          base_url=$(aws ssm get-parameter --name /shiptrack/platform/base_url --query Parameter.Value --output text)
          echo "::add-mask::$base_url"
          printf '%s' "$PUBLIC_KEY" | base64 -d >"$RUNNER_TEMP/key.pem"
          echo "ciphertext:"
          printf '%s' "$base_url" \
            | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/key.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0
          echo

name: ci-validation

# Checks the validation tooling and the scripts that gate Terraform: lint and tests for the contract
# suite and the simulator, `k6 inspect` for each load scenario, the shell tests, and the database
# scripts against a throwaway PostgreSQL. None of this needs AWS, so it also runs for pull requests
# from forks.

on:
  pull_request:
    paths:
      - "validation/**"
      - "scripts/**"
      - "db/**"
      - ".github/workflows/ci-validation.yml"

permissions:
  contents: read

concurrency:
  group: validation-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"
  K6_VERSION: "2.3.0"

jobs:
  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: validation/contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - name: Lint
        run: uvx --from ruff==0.9.10 ruff check .
      - name: Collect the tests (every endpoint in legacy section 3.4 must be covered)
        run: uv run --frozen pytest --collect-only -q
      - name: Check endpoint coverage
        run: uv run --frozen pytest tests/test_endpoint_coverage.py -q

  simulator:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: validation/simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - name: The wheel builds
        run: uv build --wheel

  loadtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: k6 inspect
        working-directory: validation/loadtest
        run: |
          for scenario in baseline stress soak; do
            k6 inspect "$scenario.js" >/dev/null
            echo "$scenario.js is valid"
          done

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/tests/*.sh db/tests/*.sh
      - name: Test terraform-ci.sh against fake aws and terraform
        run: scripts/tests/test_terraform_ci.sh
      - name: Test force-unlock.sh against fake aws and terraform
        run: scripts/tests/test_force_unlock.sh
      - name: Test rollback-cutover.sh against a fake ALB
        run: scripts/tests/test_rollback_cutover.sh
      - name: Test cutover-gates.sh against fake CloudWatch
        run: scripts/tests/test_cutover_gates.sh
      - name: Test security-findings.sh against fake Inspector and Security Hub
        run: scripts/tests/test_security_findings.sh
      - name: Test ssm-run.sh against a fake SSM
        run: scripts/tests/test_ssm_run.sh
      - name: Test reset-data.sh against a fake aws and psql
        run: scripts/tests/test_reset_data.sh
      - name: Test terraform-destroy.sh against fake aws and terraform
        run: scripts/tests/test_terraform_destroy.sh

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run bootstrap.sql twice against PostgreSQL
        run: db/tests/bootstrap.sh
      - name: Run reset-data.sql as the application role against PostgreSQL
        run: db/tests/reset-data.sh

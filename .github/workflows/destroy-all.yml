name: destroy-all

# Takes down the whole platform stack (ADR-0038): the database with no final snapshot, the load balancer and
# the main address, the target groups, the network, the three buckets with everything in them, the keys
# (scheduled for deletion by AWS), the secrets (deleted at once), the alarms and topics, the ShipTrack
# documents, the `/shiptrack/platform/*` contract, and the account-level security services that this root
# turned on (CloudTrail, GuardDuty, Security Hub, Config, Inspector, Access Analyzer). EVERY SHIPMENT, EVERY
# DOCUMENT, AND EVERY BACKUP IS DELETED. The bootstrap root is not touched: the state bucket, the permission
# boundary, and the deploy roles stay. Two jobs, each in the `dev` environment and each needing the owner's
# approval: the first shows the addresses and actions, the second runs the destroy. Both fail unless
# `confirm` is exactly `all`.
#
# Run it last of the three destroy-all workflows. It refuses to start while the legacy or the modern stack
# still has parameters under /shiptrack/legacy or /shiptrack/modern, because those stacks use this one's keys,
# network, database, and target groups. A run that stops part-way can be dispatched again.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type all to take the platform stack down"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tf-platform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the platform stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # Register the preview addresses as masked values before any step can print them (ADR-0026).
      - name: Mask the preview addresses
        env:
          PREVIEW_CIDRS: ${{ secrets.PREVIEW_CIDRS }}
        run: |
          jq -r '.[]?' <<<"${PREVIEW_CIDRS:-[]}" | while read -r cidr; do
            [[ -n "$cidr" ]] || continue
            echo "::add-mask::$cidr"
            echo "::add-mask::${cidr%/*}"
          done
      - name: Plan the destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_owner: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
          TF_VAR_preview_ingress_cidrs: ${{ secrets.PREVIEW_CIDRS || '[]' }}
        run: scripts/terraform-destroy.sh plan all

  destroy:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the platform stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Mask the preview addresses
        env:
          PREVIEW_CIDRS: ${{ secrets.PREVIEW_CIDRS }}
        run: |
          jq -r '.[]?' <<<"${PREVIEW_CIDRS:-[]}" | while read -r cidr; do
            [[ -n "$cidr" ]] || continue
            echo "::add-mask::$cidr"
            echo "::add-mask::${cidr%/*}"
          done
      # A fresh plan is made in this step and applied from the same step; no plan file is uploaded. The
      # protection is lowered on the database, the load balancer, the three buckets, and the two kinds of
      # secret only. A second attempt waits for the network interfaces of the deleted load balancer and
      # database to be released.
      - name: Destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          UNPROTECT_VARS: deletion_protection=false skip_final_snapshot=true force_destroy_buckets=true secret_recovery_window_days=0
          UNPROTECT_TARGETS: >-
            module.database.aws_db_instance.this
            module.database.aws_secretsmanager_secret.db
            module.ingress.aws_lb.this
            module.ingress.aws_secretsmanager_secret.test_token
            module.storage.aws_s3_bucket.pod
            module.storage.aws_s3_bucket.alb_logs
            module.storage.aws_s3_bucket.cloudtrail
          DESTROY_ATTEMPTS: "2"
          RETRY_WAIT_SECONDS: "300"
          TF_VAR_owner: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
          TF_VAR_preview_ingress_cidrs: ${{ secrets.PREVIEW_CIDRS || '[]' }}
        run: scripts/terraform-destroy.sh destroy all

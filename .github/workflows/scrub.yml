name: scrub

# Fails a pull request that adds a secret or an identifier that must not appear in a public
# repository: AWS account IDs and ALB DNS names (design §6.12), plus gitleaks' default secret rules.
# It scans the files as they will be merged and every commit on the branch, because a commit
# stays public once pushed even if a later commit removes it. Rules are in .gitleaks.toml.
# Findings are redacted in the log.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scrub-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_<version>_linux_x64.tar.gz, from the release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >>"$GITHUB_PATH"
      - name: Scan the files
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Scan the commits on the branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="${BASE}..${HEAD}"

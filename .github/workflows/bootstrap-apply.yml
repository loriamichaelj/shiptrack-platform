name: bootstrap-apply

# Applies bootstrap/ (state bucket, permission boundary, and the nine deploy roles) using the
# manually created seed role. Both jobs run in the `bootstrap` environment, which requires a
# reviewer: approve the first to see the plan summary, then approve the second to apply it.
# See bootstrap/README.md for the one-time setup.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: bootstrap
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
          TF_VAR_seed_role_name: ${{ vars.SEED_ROLE_NAME }}
        run: bootstrap/scripts/ci.sh plan

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: bootstrap
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # A fresh plan is made in this job and applied from the same job; no plan file is uploaded.
      - name: Apply
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
          TF_VAR_seed_role_name: ${{ vars.SEED_ROLE_NAME }}
        run: bootstrap/scripts/ci.sh apply

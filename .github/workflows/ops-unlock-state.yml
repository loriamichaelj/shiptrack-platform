name: ops-unlock-state

# Removes a stale Terraform state lock on terraform/envs/dev. A cancelled or killed run can leave its
# lock behind, and then every plan and apply fails on it. Run it by hand with the lock ID from the
# failing run. The `dev` environment requires a reviewer, and scripts/force-unlock.sh refuses a lock
# that carries a different ID or is younger than 30 minutes.

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: "ID of the stale lock, from the Error acquiring the state lock message"
        required: true
        type: string

permissions:
  contents: read

# The same group as terraform-apply, so this waits for a running apply instead of racing it.
concurrency:
  group: tf-platform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  unlock:
    # Only `dev` is ever applied; the `dev` environment's branch rule enforces it as well.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Remove the lock
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          LOCK_ID: ${{ inputs.lock_id }}
        run: scripts/force-unlock.sh "$LOCK_ID"

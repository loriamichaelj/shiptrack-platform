# Fast local checks before a commit. CI runs the same checks and more (terraform-pr.yml, scrub.yml),
# so this file is a convenience, not a gate. Install once with: pre-commit install
# Revisions are commit SHAs; the tag is in the comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7 # v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
  - repo: https://github.com/bridgecrewio/checkov
    rev: bbe2e102088f6ef4204ea6ff728e2c2ade38cc51 # 3.3.21, the version CI runs
    hooks:
      - id: checkov
        args: ["--config-file", ".checkov.yaml", "--skip-path", "\\.terraform"]
  - repo: local
    hooks:
      # Same flags as the gate in terraform-pr.yml. Needs trivy on the PATH (brew install trivy).
      - id: trivy-config
        name: Trivy config
        entry: trivy config --severity HIGH,CRITICAL --skip-dirs "**/.terraform" --exit-code 1 .
        language: system
        files: \.tf$
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
